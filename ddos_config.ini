[PROTECTION]
# Dakika başına maksimum istek sayısı
max_requests_per_minute = 60

# IP başına maksimum bağlantı sayısı
max_connections_per_ip = 10

# Ban süresi (dakika)
ban_duration_minutes = 30

# Güvenilir IP listesi dosyası
whitelist_file = whitelist.txt

# Kara liste dosyası
blacklist_file = blacklist.txt

# Otomatik ban aktivasyonu
auto_ban_enabled = true

# SYN flood koruması
syn_flood_protection = true

# Adaptif koruma (saldırı sırasında parametreleri sıkılaştır)
adaptive_protection = true

[DETECTION]
# Şüpheli aktivite eşiği
suspicious_threshold = 100

# Maksimum paket boyutu (byte)
packet_size_threshold = 65536

# Kalıp tespiti aktif mi
enable_pattern_detection = true

# UDP amplification tespiti
udp_amplification_detection = true

# Slowloris saldırı tespiti
slowloris_detection = true

# HTTP flood tespiti
http_flood_detection = true

# Minimum bağlantı süresi (saniye) - çok hızlı bağlantıları tespit et
min_connection_duration = 1.0

[GEOGRAPHIC]
# İzin verilen ülkeler (ISO 3166-1 alpha-2 kodları)
allowed_countries = TR,US,GB,DE,FR,NL,CA

# Coğrafi engelleme aktif mi
enable_geo_blocking = false

# VPN/Proxy tespiti
block_vpn_proxy = true

# Tor çıkış düğümlerini engelle
block_tor_exit_nodes = true

[LOGGING]
# Log seviyesi (DEBUG, INFO, WARNING, ERROR)
log_level = INFO

# Log dosyası boyut limiti (MB)
max_log_size_mb = 100

# Kaç adet log dosyası tutulsun
log_file_count = 5

# Saldırı loglarını ayrı dosyada tut
separate_attack_logs = true

[ALERTS]
# E-posta uyarıları aktif mi
email_alerts_enabled = false

# SMTP sunucu ayarları
smtp_server = smtp.gmail.com
smtp_port = 587
smtp_username = your_email@gmail.com
smtp_password = your_app_password
alert_recipients = admin@yourserver.com,security@yourserver.com

# Discord webhook URL'si
discord_webhook_url = 

# Telegram bot ayarları
telegram_bot_token = 
telegram_chat_id = 

# Kritik saldırı eşiği (dakikada bu kadar saldırı tespit edilirse uyarı gönder)
critical_attack_threshold = 50

[FIVEM_INTEGRATION]
# FiveM sunucu portu
fivem_port = 30120

# Txadmin portu
txadmin_port = 40120

# FiveM sunucu IP'si
fivem_server_ip = 127.0.0.1

# Oyuncu bağlantı koruması
player_connection_protection = true

# Resource koruma
resource_protection = true

# OneSync trafiği koruması
onesync_protection = true

[PERFORMANCE]
# Thread sayısı
max_threads = 4

# Veritabanı optimization
db_optimization = true

# Memory cache boyutu (MB)
memory_cache_size = 256

# İstatistik güncelleme aralığı (saniye)
stats_update_interval = 60

# Cleanup aralığı (saniye)
cleanup_interval = 300

[ADVANCED]
# Machine learning tabanlı tespit
ml_detection_enabled = false

# Honeypot sistemi
honeypot_enabled = false

# DPI (Deep Packet Inspection)
deep_packet_inspection = false

# Rate limiting algoritması (token_bucket, sliding_window, fixed_window)
rate_limit_algorithm = token_bucket

# Kalıp analizi derinliği
pattern_analysis_depth = 100

# Adaptif threshold ayarlaması
adaptive_threshold = true 